# Ritiro di una versione dall'appcast (spec 27, #223). Solo a mano, con il tag da ritirare.
# Segreti (#220): SPARKLE_ED_PRIVATE_KEY, BUBO_RELEASES_TOKEN.
name: Ritira una versione

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da ritirare (vX.Y.Z o vX.Y.Z-beta.N)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  yank:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Ritiro
        env:
          TAG: ${{ inputs.tag }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.BUBO_RELEASES_TOKEN }}
        run: scripts/release/yank.sh "$TAG"
