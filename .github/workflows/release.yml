# Release firmata e notarizzata sul tag vX.Y.Z o vX.Y.Z-beta.N (spec 27, #221).
# Segreti, con i nomi di #220: DEVELOPER_ID_P12 (base64), DEVELOPER_ID_P12_PASSWORD, NOTARY_KEY_P8,
# NOTARY_KEY_ID, NOTARY_ISSUER, SPARKLE_ED_PRIVATE_KEY, RELEASES_TOKEN (scrittura solo su
# mgiuditta/bubo-releases, con Pages sul ramo gh-pages).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASES_REPO: mgiuditta/bubo-releases
    steps:
      - uses: actions/checkout@v5

      - name: Versione dal tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-beta\.[0-9]+)?$ ]]; then
            echo "::error::tag $TAG fuori formato: vX.Y.Z o vX.Y.Z-beta.N"
            exit 1
          fi
          {
            echo "marketing=${BASH_REMATCH[1]}"
            echo "name=${TAG#v}"
            echo "prerelease=$([[ -n "${BASH_REMATCH[2]}" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Note di rilascio in ogni lingua
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          bun scripts/release/appcast.ts notes "$NAME" "$RUNNER_TEMP/notes" "Bubo-$NAME"

      - name: XcodeGen
        run: brew install xcodegen

      - name: Segreti presenti
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          missing=0
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER SPARKLE_ED_PRIVATE_KEY RELEASES_TOKEN; do
            if [[ -z "${!name}" ]]; then echo "::error::segreto $name mancante (#220)"; missing=1; fi
          done
          exit $missing

      - name: Portachiavi e chiave di App Store Connect
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          scripts/release/keychain.sh create
          key="$RUNNER_TEMP/AuthKey.p8"
          # Il .p8 è testo PEM: si accetta così com'è o in base64.
          if [[ "$NOTARY_KEY_P8" == -----BEGIN* ]]; then
            printf '%s\n' "$NOTARY_KEY_P8" > "$key"
          else
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$key"
          fi
          echo "ASC_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build e export Developer ID
        env:
          ASC_API_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.NOTARY_ISSUER }}
          MARKETING: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ github.run_number }}
          NAME: ${{ steps.version.outputs.name }}
        run: scripts/release/build.sh "$MARKETING" "$BUILD_NUMBER" "$RUNNER_TEMP/build" "$NAME"

      - name: Firma dall'interno verso l'esterno
        run: scripts/release/sign.sh "$RUNNER_TEMP/build/export/Bubo.app"

      - name: Velocità del ponte firmato
        run: scripts/release/bridge-speed.sh

      - name: DMG firmato
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: scripts/release/dmg.sh "$RUNNER_TEMP/build/export/Bubo.app" "$RUNNER_TEMP/Bubo-$NAME.dmg"

      - name: Notarizzazione e stapling
        env:
          ASC_API_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.NOTARY_ISSUER }}
          NAME: ${{ steps.version.outputs.name }}
        run: scripts/release/notarize.sh "$RUNNER_TEMP/Bubo-$NAME.dmg"

      - name: Release in bubo-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          dmg="$RUNNER_TEMP/Bubo-$NAME.dmg"
          # Rilancio del job dopo un appcast fallito: la release c'è già, si sostituisce il DMG.
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" --repo "$RELEASES_REPO" --clobber
          else
            flags=()
            [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
            gh release create "$TAG" "$dmg" --repo "$RELEASES_REPO" --title "Bubo $NAME" \
              --notes-file "$RUNNER_TEMP/notes/Bubo-$NAME.md" "${flags[@]}"
          fi

      - name: Appcast su Pages
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.version.outputs.name }}
        run: scripts/release/appcast.sh "$RUNNER_TEMP/Bubo-$NAME.dmg" "$TAG"

      - name: Pulizia
        if: always()
        run: |
          scripts/release/keychain.sh delete
          rm -f "$RUNNER_TEMP/AuthKey.p8"
