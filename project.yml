name: Bubo
options:
  bundleIdPrefix: com.mgiuditta
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  developmentLanguage: it
  createIntermediateGroups: true

packages:
  # Tipi, cifratura e firma del Telecomando, condivisi da Mac e iPhone (spec 21).
  RemoteKit:
    path: Packages/RemoteKit
  # Formato .bubo, cifratura HPKE a pezzi e codice di verifica della Consegna (spec 24).
  DeliveryKit:
    path: Packages/DeliveryKit
  # Solo la vista del terminale, versione fissata: dopo la 1.20 arrivano cambi di API (spec 15).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  # Embedding locali dell'Indice (#112): solo MLXEmbedders, niente MLXHuggingFace e quindi niente macro.
  # mlx-swift-lm vuole mlx-swift 0.32.x: fissata anche quella, per importare MLX.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
  # Solo il tokenizer dei modelli; i pesi li scarica Bubo (Index/EmbeddingModel).
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4
  # Aggiornamenti dell'app (spec 27): firma EdDSA, feed firmato, Canale beta. Servizi XPC tolti dopo la build.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # Diarizzazione delle Riunioni (#549), Apache 2.0: i modelli (CC-BY-4.0) li scarica al primo uso, mai nel bundle.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.5

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: U38D796ZBJ
    CODE_SIGN_STYLE: Automatic
    # Developer ID arriva all'export dell'archivio (xcodebuild -exportArchive), che crea il suo profile.
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Release:
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  Bubo:
    type: application
    platform: macOS
    sources:
      - path: Bubo
        excludes:
          - Resources/Fonts
          - "**/*.md"
          - "**/*.c"
      - path: Bubo/Resources/Fonts
        type: folder
        buildPhase: resources
      # La minima di claude, la stessa che legge il ponte (spec 27): ClaudeCompatibility la legge dal bundle.
      - path: bridge/compat.json
        buildPhase: resources
    dependencies:
      - package: RemoteKit
      - package: DeliveryKit
      - target: BuboQuickLook
      - package: SwiftTerm
      - package: MLXSwiftLM
        product: MLXEmbedders
      - package: MLXSwift
        product: MLX
      - package: SwiftTransformers
        product: Tokenizers
      - package: Sparkle
      - package: FluidAudio
        product: FluidAudio
    # Lo schema bubo:// non ha una chiave INFOPLIST_KEY_*: va in un Info.plist, unito a quello generato (spec 16).
    info:
      path: Bubo/Info.plist
      properties:
        # XcodeGen scriverebbe 1.0 e 1: si tengono le versioni dei build setting.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Il nome della release (1.2.0-beta.3), mostrato in Impostazioni › Aggiornamenti; build.sh lo passa dal tag.
        BuboReleaseName: $(BUBO_RELEASE_NAME)
        # Sparkle (spec 27): feed e chiave pubblica dai build setting sotto, da riempire con #220.
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
        # Un token rubato non basta a riscrivere l'appcast; senza la verifica prima dell'estrazione Sparkle non parte.
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        # Il controllo non invia niente del Mac.
        SUEnableSystemProfiling: false
        # Il process tap di Core Audio, per l'audio dell'app di una Riunione (#545): senza, macOS non lo chiede.
        NSAudioCaptureUsageDescription: "Bubo registra l'audio dell'app che scegli per una Riunione e lo trascrive sul Mac."
        CFBundleURLTypes:
          - CFBundleURLName: com.mgiuditta.bubo
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - bubo
        # Il file .bubo, Consegna o Biglietto (spec 24): Bubo lo apre al doppio clic.
        CFBundleDocumentTypes:
          - CFBundleTypeName: File Bubo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.mgiuditta.bubo.consegna
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.mgiuditta.bubo.consegna
            UTTypeDescription: File Bubo
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - bubo
    entitlements:
      path: Bubo/Bubo.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.mgiuditta.bubo
        # La cartella dei Biglietti e della chiave di questa Macchina, condivisa con BuboQuickLook (spec 24).
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.mgiuditta.bubo
        # Il runtime rinforzato nega il microfono senza questa eccezione (push-to-talk, spec 08).
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgiuditta.bubo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        BUBO_RELEASE_NAME: $(MARKETING_VERSION)
        # Da riempire con #220: l'URL dell'appcast su Pages di mgiuditta/bubo-releases e la chiave pubblica EdDSA
        # (generate_keys -p). Vuoti, gli aggiornamenti restano spenti e build.sh si ferma.
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_ED_KEY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bubo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Matteo Giuditta"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bubo ascolta mentre tieni premuta la scorciatoia o registri una Riunione, e trascrive sul Mac."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bubo trascrive sul Mac quello che dici mentre tieni premuta la scorciatoia."
    postBuildScripts:
      - name: Ponte agente
        shell: /bin/zsh
        script: |
          set -euo pipefail
          bun=$(command -v bun || echo "$HOME/.bun/bin/bun")
          helper="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/bubo-agent"
          mkdir -p "${helper:h}"
          cd "$SRCROOT/bridge"
          # Niente dipendenze opzionali: il binario claude dell'SDK non serve, si usa quello dell'utente (ADR 0003).
          "$bun" install --frozen-lockfile --omit=optional
          "$bun" build --compile --minify src/main.ts --outfile "$helper"
          # Firmato prima dell'app, con runtime rafforzato e il solo allow-jit che serve a Bun.
          codesign --force --options runtime --entitlements entitlements.plist --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$helper"
        inputFiles:
          - $(SRCROOT)/bridge/src/main.ts
          - $(SRCROOT)/bridge/compat.json
          - $(SRCROOT)/bridge/package.json
          - $(SRCROOT)/bridge/bun.lock
          - $(SRCROOT)/bridge/entitlements.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/bubo-agent
      - name: Sparkle senza servizi XPC
        shell: /bin/zsh
        script: |
          set -euo pipefail
          # Bubo non è in sandbox: i servizi XPC di Sparkle non servono (spec 27); il framework si rifirma senza.
          framework="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          [[ -d $framework ]] || exit 0
          rm -rf "$framework/Versions/B/XPCServices" "$framework/XPCServices"
          codesign --force --options runtime --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$framework"
        # Dopo la copia del framework nel bundle, mai in parallelo con lei.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework
        basedOnDependencyAnalysis: false
      - name: Lanciatore del terminale
        shell: /bin/zsh
        script: |
          set -euo pipefail
          launcher="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/bubo-terminal"
          mkdir -p "${launcher:h}"
          flags=()
          for arch in ${=ARCHS}; do flags+=(-arch $arch); done
          xcrun clang -O2 -Wall -Werror $flags -mmacosx-version-min="$MACOSX_DEPLOYMENT_TARGET" \
            "$SRCROOT/Bubo/Terminal/TerminalLauncher.c" -o "$launcher"
          codesign --force --options runtime --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$launcher"
        inputFiles:
          - $(SRCROOT)/Bubo/Terminal/TerminalLauncher.c
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/bubo-terminal
      - name: Script di Linear
        shell: /bin/zsh
        script: |
          set -euo pipefail
          opener="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/bubo-linear"
          mkdir -p "${opener:h}"
          flags=()
          for arch in ${=ARCHS}; do flags+=(-arch $arch); done
          xcrun clang -O2 -Wall -Werror $flags -mmacosx-version-min="$MACOSX_DEPLOYMENT_TARGET" \
            "$SRCROOT/Bubo/Integrations/LinearOpener.c" -o "$opener"
          codesign --force --options runtime --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$opener"
        inputFiles:
          - $(SRCROOT)/Bubo/Integrations/LinearOpener.c
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/bubo-linear
      - name: Archivio Metal 4 del Blob
        shell: /bin/zsh
        script: |
          [[ "$CONFIGURATION" == Release ]] || exit 0
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          "$SRCROOT/scripts/metal-archive.sh" "$SRCROOT/Bubo/Orb/Orb.metal" "$resources"
        inputFiles:
          - $(SRCROOT)/scripts/metal-archive.sh
          - $(SRCROOT)/Bubo/Orb/Orb.metal
          - $(SRCROOT)/Bubo/Orb/OrbShading.h
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Orb.metallib
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Orb.mtl4archive
  # Quick Look del .bubo: solo l'intestazione in chiaro e i Biglietti ricevuti, mai il contenuto cifrato (spec 24).
  BuboQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: BuboQuickLook
        excludes:
          - "*.entitlements"
      - path: Bubo/Deliveries/TicketStore.swift
      - path: Bubo/Deliveries/BuboFileSummary.swift
    dependencies:
      - package: DeliveryKit
    # Un'estensione Quick Look gira solo in sandbox; legge i Biglietti dall'App Group che l'app scrive.
    entitlements:
      path: BuboQuickLook/BuboQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.mgiuditta.bubo
    info:
      path: BuboQuickLook/Info.plist
      properties:
        CFBundleDisplayName: Bubo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes:
              - com.mgiuditta.bubo.consegna
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgiuditta.bubo.quicklook
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  # Il Telecomando: l'app iPhone di Bubo (spec 21, ADR 0007).
  BuboRemote:
    type: application
    platform: iOS
    sources:
      - path: BuboRemote
    dependencies:
      - package: RemoteKit
      - target: RemoteNotificationService
    # Il portachiavi dei Mac accoppiati è condiviso con l'estensione delle notifiche, che decifra le Richieste.
    entitlements:
      path: BuboRemote/BuboRemote.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.mgiuditta.bubo.remote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgiuditta.bubo.remote
        PRODUCT_NAME: Bubo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Bubo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Bubo usa la fotocamera solo per leggere il QR di accoppiamento del Mac."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID protegge la chiave con cui il Telecomando firma le tue decisioni."
  # Scrive il testo delle notifiche delle Richieste dal record cifrato (spec 21).
  RemoteNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: RemoteNotificationService
        excludes:
          - "*.entitlements"
      - path: BuboRemote/Shared
    dependencies:
      - package: RemoteKit
    entitlements:
      path: RemoteNotificationService/RemoteNotificationService.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.mgiuditta.bubo.remote
    info:
      path: RemoteNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Bubo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgiuditta.bubo.remote.notifications
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
  BuboTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BuboTests
      # Every Forma again, with its GPU probe kernel (FORMA_PROBE): FormaTests reads the SDFs through it.
      - path: Bubo/Orb/Forme
      # The frame log reader of the performance tests, checked against what the app writes.
      - path: BuboPerfTests/FrameLog.swift
      # The budgets and the report of scripts/perf.sh.
      - path: BuboPerfTests/PerfBudgets.swift
      - path: BuboPerfTests/PerfMeasurement.swift
      - path: scripts/perf/BudgetReport.swift
      - path: scripts/perf/MetalHUDLog.swift
    dependencies:
      - target: Bubo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mgiuditta.bubo.tests
        MTL_PREPROCESSOR_DEFINITIONS: FORMA_PROBE=1
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bubo.app/Contents/MacOS/Bubo"
        BUNDLE_LOADER: "$(TEST_HOST)"
  BuboPerfTests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: BuboPerfTests
        excludes:
          - "*.entitlements"
    # The runner is sandboxed: the homes of OnboardingPerfTests go in /tmp, where the `claude` Bubo starts can read
    # them, not in the runner's container, which macOS hides from other apps.
    entitlements:
      path: BuboPerfTests/BuboPerfTests.entitlements
      properties:
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - /private/tmp/
    dependencies:
      - target: Bubo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mgiuditta.bubo.perftests
        TEST_TARGET_NAME: Bubo
  BuboUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: BuboUITests
    dependencies:
      - target: Bubo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mgiuditta.bubo.uitests
        TEST_TARGET_NAME: Bubo

schemes:
  Bubo:
    build:
      targets:
        Bubo: all
        BuboTests: [test]
        BuboUITests: [test]
    test:
      targets:
        - BuboTests
        - BuboUITests
  BuboRemote:
    build:
      targets:
        BuboRemote: all
  BuboPerf:
    build:
      targets:
        Bubo: all
        BuboPerfTests: [test]
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - BuboPerfTests
