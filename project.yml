name: Bubo
options:
  bundleIdPrefix: com.mgiuditta
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: it
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: U38D796ZBJ
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  Bubo:
    type: application
    platform: macOS
    sources:
      - path: Bubo
        excludes:
          - Resources/Fonts
      - path: Bubo/Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgiuditta.bubo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bubo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Matteo Giuditta"
    postBuildScripts:
      - name: Archivio Metal 4 delle Forme
        shell: /bin/zsh
        script: |
          [[ "$CONFIGURATION" == Release ]] || exit 0
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          "$SRCROOT/scripts/metal-archive.sh" "$resources/default.metallib" "$SRCROOT/Bubo/Orb/Orb.metal" "$resources/Forme.mtl4archive"
        inputFiles:
          - $(SRCROOT)/scripts/metal-archive.sh
          - $(SRCROOT)/Bubo/Orb/Orb.metal
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/default.metallib
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Forme.mtl4archive
  BuboTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BuboTests
    dependencies:
      - target: Bubo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mgiuditta.bubo.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bubo.app/Contents/MacOS/Bubo"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Bubo:
    build:
      targets:
        Bubo: all
        BuboTests: [test]
    test:
      targets:
        - BuboTests
