  <use href="#squircle" fill="url(#body)"/>
  <g clip-path="url(#inside)">
    <circle cx="512" cy="570" r="400" fill="url(#halo)"/>
    <!-- Anello dell'HUD attorno all'Orb, in lineStrong. -->
    <circle cx="512" cy="570" r="318" fill="none" stroke="#E2E8F0" stroke-opacity="0.14" stroke-width="6"/>
  </g>
  <use href="#squircle" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- Il gufo: disco r 245 centrato in (512, 570); due ciuffi spinti in fuori e la V del disco facciale tra loro,
