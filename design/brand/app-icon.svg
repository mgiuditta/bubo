<?xml version="1.0" encoding="UTF-8"?>
<!-- Icona di Bubo (proposta provvisoria, issue #228). Griglia macOS: tela 1024, corpo squircle 824 centrato
     (superellisse n = 5), margine di 100 per l'ombra. Contenitore Notte acromatico; il disco color luna con due
     ciuffi è l'Orb a riposo che diventa gufo reale. Rigenera le PNG con scripts/brand-icons.sh. -->
