  <defs>
    <linearGradient id="body" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C1F24"/>
      <stop offset="1" stop-color="#0A0B0D"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2E8F0" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#E2E8F0" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#E2E8F0" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="570" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ECEEF1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ECEEF1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="430" cy="420" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F7F9"/>
      <stop offset="0.55" stop-color="#D3D7DD"/>
      <stop offset="1" stop-color="#8E939B"/>
    </radialGradient>
